name: Update US National Parks Visitors

on:
  schedule:
    - cron: "0 0 15 * *"   # 每月 15 日检查一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest visitor column
        run: node scripts/update-us-parks-visitors.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/usa-parks-visitors.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usa-parks-visitors.json
          git commit -m "Update US national parks visitors"
          git push
