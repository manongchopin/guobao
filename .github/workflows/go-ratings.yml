name: Update Go Ratings

on:
  schedule:
    - cron: "17 0 * * *"   # 北京时间 08:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch top five
        run: node scripts/update-go-ratings.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/go-ratings-top5.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/go-ratings-top5.json
          git commit -m "Update Go Ratings top five"
          git push
