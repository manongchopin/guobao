<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>铁路记录 · 我的行程</title>
<meta name="description" content="按年份查看全部火车记录，可按车站搜索出发、到达车次。">
<meta name="theme-color" content="#f5f1e8">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/trips.css">
<link rel="stylesheet" href="assets/records.css">
</head>
<body>

<header class="hero">
  <a class="back" href="trips.html">← 我的行程</a>
  <p class="kicker">RAIL LOG · 2023–2026</p>
  <h1>铁路记录</h1>
  <p class="lede">
    按年份归档，按车站查。<br>
    <span>搜索站名，出发和到达分开列。</span>
  </p>
  <div class="seal" aria-hidden="true">铁</div>
</header>

<main class="wh-detail">

  <section class="wh-section tp-first">
    <div class="lg-stats">
      <div><b id="lg-count">0</b><span>段火车</span></div>
      <div><b id="lg-km">0</b><span>公里</span></div>
      <div><b id="lg-stations">0</b><span>车站</span></div>
      <div><b id="lg-span">—</b><span>年份跨度</span></div>
    </div>
    <p class="tp-intro">距离为站点直线距离，不是铁路里程；日期只到月份。搜索例：<b>上海虹桥</b>、<b>苏州</b>、<b>金华南</b>、<b>台北</b>。</p>
  </section>

  <section class="wh-section">
    <div class="lg-toolbar">
      <div class="tp-year-tabs" id="lg-years"></div>
      <input id="lg-search" class="lg-search" type="search" autocomplete="off"
             placeholder="搜索车站，如 上海虹桥、苏州">
    </div>
    <p class="lg-summary" id="lg-summary"></p>
    <div id="lg-all"></div>
    <div id="lg-split"></div>
  </section>

  <section class="wh-section">
    <div class="tp-head">
      <div><p class="tp-kicker">RAIL MAP · AUTO FIT</p><h2>铁路地图</h2></div>
      <p>按主要经停站连线，范围自动调整。<br>不是精确轨道。</p>
    </div>
    <div id="tp-map-region" class="tp-chart tp-chart-region"></div>
    <p class="tp-map-note">按主要经停站连线示意，境外段同样处理。</p>
  </section>

</main>

<footer class="footer">
  <div class="footer-inner">
    <span>铁路记录 · 我的行程</span>
    <span>站点直线距离 · 日期到月</span>
    <span>作者 <a href="https://manongchopin.github.io/personal-website/" target="_blank" rel="noopener">余俊鋒 · 个人主页</a></span>
    <span class="footer-rights"><a href="rights.html">来源与权利</a></span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="trips-data.js"></script>
<script src="assets/rails.js"></script>
</body>
</html>
