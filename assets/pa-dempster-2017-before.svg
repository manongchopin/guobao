<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d">
  <title id="t">2017 年以前：Dempster Highway 到 Inuvik，Inuvik 到 Tuktoyaktuk 是冬季冰路</title>
  <desc id="d">示意图：从 Dawson City 经 Eagle Plains、Fort McPherson 到 Inuvik 是全年公路；Inuvik 到 Tuktoyaktuk 一段用红色虚线表示只在冬季结冰时通行的冰路。</desc>
  <rect width="600" height="560" fill="#f5f1e8"/>
  <path d="M0,64 C70,50 130,72 200,62 C270,52 320,74 390,60 C450,48 520,68 600,54 L600,0 L0,0 Z" fill="#e0e7e4"/>
  <path d="M0,64 C70,50 130,72 200,62 C270,52 320,74 390,60 C450,48 520,68 600,54" fill="none" stroke="#b9c6c0" stroke-width="1"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="11" fill="#5d6a63" letter-spacing="2">ARCTIC OCEAN</text>

  <text x="28" y="100" font-family="Georgia, 'Songti SC', serif" font-size="18" fill="#1d2622">2017 年以前</text>
  <text x="28" y="122" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#8a938c">冬天靠冰路，其他季节路到头</text>

  <line x1="40" y1="302" x2="560" y2="302" stroke="#a8402f" stroke-width="1" stroke-dasharray="1 5"/>
  <text x="42" y="296" font-family="Georgia, 'Songti SC', serif" font-size="10" fill="#a8402f">北极圈 66°33′N</text>

  <path d="M129,500 C126,455 160,420 205,388 C240,364 260,340 268,317 C275,300 281,299 289,302 C312,295 340,262 363,232 C385,206 405,182 423,160"
        fill="none" stroke="#1d2622" stroke-width="3" stroke-linecap="round"/>
  <path d="M423,160 C434,136 447,104 458,74" fill="none" stroke="#a8402f" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
  <text x="318" y="118" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#a8402f">冰路 · 仅冬季开</text>

  <circle cx="129" cy="500" r="4.5" fill="#1d2622"/>
  <text x="140" y="496" font-family="Georgia, 'Songti SC', serif" font-size="14" fill="#1d2622">Dawson City</text>
  <text x="140" y="512" font-family="Georgia, 'Songti SC', serif" font-size="10" fill="#8a938c">育空 · 最后大采购</text>

  <circle cx="268" cy="317" r="4.5" fill="#1d2622"/>
  <text x="279" y="313" font-family="Georgia, 'Songti SC', serif" font-size="14" fill="#1d2622">Eagle Plains</text>
  <text x="279" y="329" font-family="Georgia, 'Songti SC', serif" font-size="10" fill="#8a938c">育空 · 加油 / 住宿</text>

  <circle cx="363" cy="232" r="4.5" fill="#1d2622"/>
  <text x="374" y="228" font-family="Georgia, 'Songti SC', serif" font-size="14" fill="#1d2622">Fort McPherson</text>
  <text x="374" y="244" font-family="Georgia, 'Songti SC', serif" font-size="10" fill="#8a938c">西北地区</text>

  <circle cx="423" cy="160" r="5" fill="#f5f1e8" stroke="#1d2622" stroke-width="1.6"/>
  <text x="434" y="156" font-family="Georgia, 'Songti SC', serif" font-size="14" fill="#1d2622">Inuvik</text>
  <text x="434" y="172" font-family="Georgia, 'Songti SC', serif" font-size="10" fill="#8a938c">西北地区 · 补给 / 机场</text>

  <circle cx="458" cy="74" r="5" fill="#f5f1e8" stroke="#1d2622" stroke-width="1.6"/>
  <text x="469" y="70" font-family="Georgia, 'Songti SC', serif" font-size="14" fill="#1d2622">Tuktoyaktuk</text>
  <text x="469" y="86" font-family="Georgia, 'Songti SC', serif" font-size="10" fill="#8a938c">北冰洋岸 · 冬季才通</text>

