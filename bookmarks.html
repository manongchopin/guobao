<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的收藏 · 常用网站与资料库</title>
<meta name="description" content="常用文物档案、官方机构、资料库与地图工具，集中在一页。">
<meta name="theme-color" content="#f5f1e8">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="hero">
  <a class="back" href="index.html">← 首页</a>
  <p class="kicker">Bookmarks · 常用站点</p>
  <h1>我的收藏</h1>
  <p class="lede">
    常用网站、官方档案与工具，集中在一页。<br>
    <span>少翻一次浏览器收藏夹。</span>
  </p>
  <div class="seal" aria-hidden="true">藏</div>
</header>

<div class="hub-progress">
  <div class="hub-progress-inner">
    <span class="hp-label">收藏</span>
    <span class="hp-num" id="bm-total">1</span><span class="hp-total">个站点</span>
    <span class="hp-note" id="bm-note">围棋</span>
  </div>
</div>

<div class="bm-toolbar">
  <div class="bm-toolbar-inner">
    <label class="bm-search">
      <span>搜索</span>
      <input type="search" id="bm-search" placeholder="名称、网址或标签" autocomplete="off">
    </label>
    <div class="bm-chips" id="bm-chips" role="group" aria-label="按分类筛选"></div>
  </div>
</div>

<main class="bm-main">
  <div class="bm-list" id="bm-grid"></div>
  <p class="bm-empty" id="bm-empty" hidden></p>
</main>

<footer class="footer">
  <div class="footer-inner">
    <span>我的收藏 · 常用网站与资料库</span>
    <span>外链均在新的标签页打开</span>
    <span>作者 <a href="https://manongchopin.github.io/personal-website/" target="_blank" rel="noopener">余俊鋒 · 个人主页</a></span>
  </div>
</footer>

<script src="bookmarks-data.js"></script>
<script src="assets/bookmarks.js"></script>
<script src="assets/home.js"></script>
</body>
</html>
